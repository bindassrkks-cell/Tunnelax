name: Build Singbox Tunnel APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 1. Compile SagerNet Libbox AAR (-libname fix included)
      - name: Compile Sing-box Libbox AAR
        run: |
          export PATH=$HOME/go/bin:$PATH
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}

          # Official gomobile ke badle SagerNet gomobile install karein
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          gomobile init

          # Sing-box source se libbox.aar build karein
          git clone --depth=1 https://github.com/SagerNet/sing-box.git sing-box-src
          cd sing-box-src
          go run ./cmd/internal/build_libbox android

          # Library ko app/libs folder me move karein
          mkdir -p ../app/libs
          cp experimental/libbox/*.aar ../app/libs/libbox.aar
          cd ..
          ls -lh app/libs/

      # 2. Scaffold Complete Android Project Files
      - name: Generate Android App Source Code
        run: |
          mkdir -p app/src/main/java/com/tunnel/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # Root settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SingboxTunnel"
          include ':app'
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          # App build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.tunnel.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.tunnel.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      applicationIdSuffix ".debug"
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Tunnel VPN"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.TunnelApp">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TunnelVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # Resources: strings.xml, colors.xml, themes.xml, ic_launcher.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Tunnel VPN</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="primary">#1E88E5</color>
              <color name="background">#121212</color>
              <color name="surface">#1E1E1E</color>
              <color name="text">#FFFFFF</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.TunnelApp" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="android:windowBackground">@color/background</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#1E88E5" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,25 L85,75 L23,75 Z"/>
          </vector>
          EOF

          # UI Layout: activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#121212"
              android:padding="24dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Sing-box Tunnel"
                      android:textColor="#FFFFFF"
                      android:textSize="26sp"
                      android:textStyle="bold"
                      android:layout_marginTop="24dp"
                      android:layout_marginBottom="6dp" />

                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Status: Disconnected"
                      android:textColor="#E53935"
                      android:textSize="15sp"
                      android:layout_marginBottom="28dp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Server IP / Domain"
                      android:textColor="#AAAAAA"
                      android:textSize="13sp" />

                  <EditText
                      android:id="@+id/etServerIp"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:background="#1E1E1E"
                      android:hint="Enter VPS IP"
                      android:textColorHint="#555555"
                      android:textColor="#FFFFFF"
                      android:paddingHorizontal="14dp"
                      android:layout_marginBottom="16dp"
                      android:inputType="textUri" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Server Port"
                      android:textColor="#AAAAAA"
                      android:textSize="13sp" />

                  <EditText
                      android:id="@+id/etPort"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:background="#1E1E1E"
                      android:text="443"
                      android:textColor="#FFFFFF"
                      android:paddingHorizontal="14dp"
                      android:layout_marginBottom="16dp"
                      android:inputType="number" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="VLESS UUID"
                      android:textColor="#AAAAAA"
                      android:textSize="13sp" />

                  <EditText
                      android:id="@+id/etUuid"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:background="#1E1E1E"
                      android:text="ae5b3b12-9c24-4f59-9944-672e617d91e4"
                      android:textColor="#FFFFFF"
                      android:paddingHorizontal="14dp"
                      android:layout_marginBottom="28dp"
                      android:inputType="text" />

                  <Button
                      android:id="@+id/btnToggle"
                      android:layout_width="match_parent"
                      android:layout_height="54dp"
                      android:text="Connect Tunnel"
                      android:textSize="16sp"
                      android:textStyle="bold"
                      android:backgroundTint="#1E88E5"
                      android:textColor="#FFFFFF" />

              </LinearLayout>
          </ScrollView>
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/tunnel/app/MainActivity.kt
          package com.tunnel.app

          import android.app.Activity
          import android.content.Intent
          import android.net.VpnService
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var etServerIp: EditText
              private lateinit var etPort: EditText
              private lateinit var etUuid: EditText
              private lateinit var btnToggle: Button
              private lateinit var tvStatus: TextView

              private val vpnLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == Activity.RESULT_OK) {
                      startTunnel()
                  } else {
                      Toast.makeText(this, "VPN permission denied", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  etServerIp = findViewById(R.id.etServerIp)
                  etPort = findViewById(R.id.etPort)
                  etUuid = findViewById(R.id.etUuid)
                  btnToggle = findViewById(R.id.btnToggle)
                  tvStatus = findViewById(R.id.tvStatus)

                  updateUiState()

                  btnToggle.setOnClickListener {
                      if (TunnelVpnService.isRunning) {
                          stopTunnel()
                      } else {
                          val intent = VpnService.prepare(this)
                          if (intent != null) {
                              vpnLauncher.launch(intent)
                          } else {
                              startTunnel()
                          }
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  updateUiState()
              }

              private fun startTunnel() {
                  val ip = etServerIp.text.toString().trim()
                  val portStr = etPort.text.toString().trim()
                  val uuid = etUuid.text.toString().trim()

                  if (ip.isEmpty() || portStr.isEmpty() || uuid.isEmpty()) {
                      Toast.makeText(this, "All fields are required", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val port = portStr.toIntOrNull() ?: 443
                  val config = """
                  {
                    "log": { "level": "warn" },
                    "inbounds": [
                      {
                        "type": "tun",
                        "tag": "tun-in",
                        "interface_name": "tun0",
                        "inet4_address": "172.19.0.1/30",
                        "auto_route": true,
                        "strict_route": true,
                        "stack": "gvisor",
                        "sniff": true
                      }
                    ],
                    "outbounds": [
                      {
                        "type": "vless",
                        "tag": "proxy",
                        "server": "$ip",
                        "server_port": $port,
                        "uuid": "$uuid"
                      }
                    ]
                  }
                  """.trimIndent()

                  val intent = Intent(this, TunnelVpnService::class.java).apply {
                      action = TunnelVpnService.ACTION_START
                      putExtra(TunnelVpnService.EXTRA_CONFIG, config)
                  }
                  startService(intent)
                  TunnelVpnService.isRunning = true
                  updateUiState()
              }

              private fun stopTunnel() {
                  val intent = Intent(this, TunnelVpnService::class.java).apply {
                      action = TunnelVpnService.ACTION_STOP
                  }
                  startService(intent)
                  TunnelVpnService.isRunning = false
                  updateUiState()
              }

              private fun updateUiState() {
                  if (TunnelVpnService.isRunning) {
                      btnToggle.text = "Disconnect Tunnel"
                      tvStatus.text = "Status: Connected"
                      tvStatus.setTextColor(android.graphics.Color.parseColor("#4CAF50"))
                  } else {
                      btnToggle.text = "Connect Tunnel"
                      tvStatus.text = "Status: Disconnected"
                      tvStatus.setTextColor(android.graphics.Color.parseColor("#E53935"))
                  }
              }
          }
          EOF

          # TunnelVpnService.kt
          cat << 'EOF' > app/src/main/java/com/tunnel/app/TunnelVpnService.kt
          package com.tunnel.app

          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import android.util.Log
          import io.nekohasekai.libbox.*
          import java.lang.reflect.InvocationHandler
          import java.lang.reflect.Method
          import java.lang.reflect.Proxy

          class TunnelVpnService : VpnService() {

              companion object {
                  const val ACTION_START = "com.tunnel.app.START"
                  const val ACTION_STOP = "com.tunnel.app.STOP"
                  const val EXTRA_CONFIG = "extra_config"
                  var isRunning = false
              }

              private var boxService: BoxService? = null
              private var pfd: ParcelFileDescriptor? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_START -> {
                          val config = intent.getStringExtra(EXTRA_CONFIG) ?: return START_NOT_STICKY
                          startTunnel(config)
                      }
                      ACTION_STOP -> {
                          stopTunnel()
                          stopSelf()
                      }
                  }
                  return START_NOT_STICKY
              }

              private fun startTunnel(configJson: String) {
                  Thread {
                      try {
                          val platformInterface = Proxy.newProxyInstance(
                              PlatformInterface::class.java.classLoader,
                              arrayOf(PlatformInterface::class.java),
                              object : InvocationHandler {
                                  override fun invoke(proxy: Any?, method: Method, args: Array<out Any>?): Any? {
                                      return when (method.name) {
                                          "openTun" -> {
                                              val options = args?.get(0) as? TunOptions
                                              openTunInternal(options)
                                          }
                                          "autoDetectInterfaceControl" -> {
                                              val fd = (args?.get(0) as? Number)?.toInt() ?: 0
                                              protect(fd)
                                              null
                                          }
                                          "usePlatformAutoDetectInterfaceControl" -> true
                                          "writeLog" -> {
                                              Log.d("SingBox", args?.get(0)?.toString() ?: "")
                                              null
                                          }
                                          else -> {
                                              when (method.returnType) {
                                                  java.lang.Boolean.TYPE -> false
                                                  java.lang.Integer.TYPE -> 0
                                                  java.lang.Long.TYPE -> 0L
                                                  else -> null
                                              }
                                          }
                                      }
                                  }
                              }
                          ) as PlatformInterface

                          boxService = Libbox.newService(configJson, platformInterface)
                          boxService?.start()
                          isRunning = true
                      } catch (e: Exception) {
                          Log.e("SingBox", "Core start failed", e)
                          stopTunnel()
                          stopSelf()
                      }
                  }.start()
              }

              private fun openTunInternal(options: TunOptions?): Int {
                  val builder = Builder()
                      .setSession("TunnelVPN")
                      .setMtu(options?.mtu ?: 1500)
                      .addRoute("0.0.0.0", 0)
                      .addDnsServer("8.8.8.8")
                      .addDisallowedApplication(packageName)

                  options?.inet4Address?.let {
                      builder.addAddress(it.address, it.prefix)
                  } ?: run {
                      builder.addAddress("172.19.0.1", 30)
                  }

                  pfd = builder.establish()
                  return pfd?.fd ?: throw IllegalStateException("VPN establish failed")
              }

              private fun stopTunnel() {
                  isRunning = false
                  try {
                      boxService?.close()
                      boxService = null
                  } catch (_: Exception) {}
                  try {
                      pfd?.close()
                      pfd = null
                  } catch (_: Exception) {}
              }

              override fun onDestroy() {
                  stopTunnel()
                  super.onDestroy()
              }
          }
          EOF

      # 3. Assemble Ready-to-Install APK
      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace

      # 4. Upload APK to GitHub Artifacts
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Singbox-Tunnel-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
