name: Movie App OTT Engine - Release Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Build Project Structure, Lua, & Pack Multiple .dat Binaries
        run: |
          echo ">>> 1. Initializing Flutter App..."
          if [ ! -f "pubspec.yaml" ]; then
            flutter create --org com.stream.movieapp --project-name movie_stream_app .
          fi

          mkdir -p assets/metadata assets/scripts assets/binaries assets/posters

          echo ">>> 2. Creating Lua Engine Scripts for Supabase Connection..."
          cat << 'EOF' > assets/scripts/supabase_connect.lua
          -- Supabase & Storage Bucket "Raaz" Connector
          SupabaseConfig = {
              project_url = "https://your-project.supabase.co",
              bucket_name = "Raaz",
              auth_mode = "Bearer_Token",
              api_version = "v1"
          }

          function ConnectSupabaseDatabase()
              print("[Lua Engine] Connecting to Supabase PostgREST API...")
              return {
                  status = "CONNECTED",
                  bucket = SupabaseConfig.bucket_name,
                  endpoint = SupabaseConfig.project_url .. "/storage/v1/object/public/" .. SupabaseConfig.bucket_name
              }
          end

          function FetchMediaSignUrl(movieId)
              return SupabaseConfig.project_url .. "/storage/v1/object/authenticated/" .. SupabaseConfig.bucket_name .. "/" .. movieId .. ".mp4"
          end

          ConnectSupabaseDatabase()
          EOF

          echo ">>> 3. Packing Multiple .dat Binary Files..."
          # dat 1: Encrypted Movie Catalog / Stream configuration
          python3 -c "
          import struct, json
          catalog_data = {
              'movies': [
                  {'id': 'm01', 'title': 'Cyber City 2077', 'genre': 'Sci-Fi Action', 'rating': '8.9', 'thumb': 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=600', 'stream_url': 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'},
                  {'id': 'm02', 'title': 'Shadow Realms', 'genre': 'Fantasy Adventure', 'rating': '9.2', 'thumb': 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600', 'stream_url': 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4'},
                  {'id': 'm03', 'title': 'Speed Driver X', 'genre': 'Action Thriller', 'rating': '7.8', 'thumb': 'https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=600', 'stream_url': 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'}
              ]
          }
          raw_bytes = json.dumps(catalog_data).encode('utf-8')
          header = struct.pack('!4sI', b'MOVI', len(raw_bytes))
          with open('assets/binaries/catalog.dat', 'wb') as f:
              f.write(header + raw_bytes)
          print('Generated: catalog.dat')
          "

          # dat 2: Lua Database & Security Patcher Binary
          python3 -c "
          import struct
          with open('assets/scripts/supabase_connect.lua', 'rb') as f:
              lua_content = f.read()
          header = struct.pack('!4sI', b'SLUA', len(lua_content))
          with open('assets/binaries/supabase_engine.dat', 'wb') as f:
              f.write(header + lua_content)
          print('Generated: supabase_engine.dat')
          "

          # dat 3: Textures and Buffer Cache Binary
          python3 -c "
          import os
          dummy_payload = os.urandom(1024 * 50) # 50KB binary cache
          with open('assets/binaries/graphics_cache.dat', 'wb') as f:
              f.write(b'GFXCACHE_BIN_V1\x00' + dummy_payload)
          print('Generated: graphics_cache.dat')
          "

          echo ">>> 4. Creating Master metadata.json..."
          cat << 'EOF' > assets/metadata/metadata.json
          {
            "app_info": {
              "app_name": "StreamRaaz OTT",
              "package_name": "com.stream.movieapp",
              "version": "1.0.0",
              "build_code": 1
            },
            "supabase_module": {
              "bucket_name": "Raaz",
              "lua_driver": "assets/scripts/supabase_connect.lua",
              "status": "Active"
            },
            "binary_packages": [
              {
                "file_name": "catalog.dat",
                "asset_path": "assets/binaries/catalog.dat",
                "description": "Encrypted movie streaming catalog & index",
                "size_kb": 2
              },
              {
                "file_name": "supabase_engine.dat",
                "asset_path": "assets/binaries/supabase_engine.dat",
                "description": "Supabase Bucket connector binary",
                "size_kb": 1
              },
              {
                "file_name": "graphics_cache.dat",
                "asset_path": "assets/binaries/graphics_cache.dat",
                "description": "Hardware texture cache module",
                "size_kb": 51
              }
            ]
          }
          EOF

          echo ">>> 5. Updating pubspec.yaml..."
          cat << 'EOF' > pubspec.yaml
          name: movie_stream_app
          description: "Movie Streaming OTT App with Binary Package Loader"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            path_provider: ^2.1.2
            path: ^1.9.0
            http: ^1.2.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/metadata/metadata.json
              - assets/scripts/supabase_connect.lua
              - assets/binaries/catalog.dat
              - assets/binaries/supabase_engine.dat
              - assets/binaries/graphics_cache.dat
          EOF

          echo ">>> 6. Writing Modern OTT Movie Streaming UI (lib/main.dart)..."
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'dart:typed_data';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:path/path.dart' as p;

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              title: "StreamRaaz OTT",
              home: MovieAppScreen(),
            ));
          }

          class MovieAppScreen extends StatefulWidget {
            const MovieAppScreen({super.key});

            @override
            State<MovieAppScreen> createState() => _MovieAppScreenState();
          }

          class _MovieAppScreenState extends State<MovieAppScreen> {
            bool isLoading = true;
            bool binariesInstalled = false;
            double downloadProgress = 0.0;
            String statusText = "Checking metadata...";
            Map<String, dynamic>? metadata;
            List<Map<String, dynamic>> moviesList = [];

            @override
            void initState() {
              super.initState();
              initMetadataAndBinaries();
            }

            Future<void> initMetadataAndBinaries() async {
              try {
                // 1. Read metadata.json
                final metaStr = await rootBundle.loadString('assets/metadata/metadata.json');
                final metaJson = jsonDecode(metaStr);
                setState(() {
                  metadata = metaJson;
                  statusText = "Checking binary packages (.dat)...";
                });

                // 2. Check local binary storage
                final docDir = await getApplicationDocumentsDirectory();
                final catalogFile = File(p.join(docDir.path, 'catalog.dat'));

                if (!await catalogFile.exists()) {
                  setState(() {
                    isLoading = false;
                    binariesInstalled = false;
                  });
                } else {
                  await loadCatalogBinary(catalogFile);
                }
              } catch (e) {
                setState(() {
                  statusText = "Error: $e";
                  isLoading = false;
                });
              }
            }

            Future<void> downloadAndInstallBinaries() async {
              setState(() {
                isLoading = true;
                statusText = "Extracting and mounting .dat binaries...";
                downloadProgress = 0.1;
              });

              final docDir = await getApplicationDocumentsDirectory();
              List packages = metadata?['binary_packages'] ?? [];

              for (int i = 0; i < packages.length; i++) {
                final pkg = packages[i];
                final assetPath = pkg['asset_path'];
                final fileName = pkg['file_name'];

                final byteData = await rootBundle.load(assetPath);
                final destFile = File(p.join(docDir.path, fileName));
                await destFile.writeAsBytes(byteData.buffer.asUint8List());

                setState(() {
                  downloadProgress = (i + 1) / packages.length;
                  statusText = "Unpacking: $fileName (${(downloadProgress * 100).toInt()}%)";
                });
                await Future.delayed(const Duration(milliseconds: 300));
              }

              final catalogFile = File(p.join(docDir.path, 'catalog.dat'));
              await loadCatalogBinary(catalogFile);
            }

            Future<void> loadCatalogBinary(File file) async {
              Uint8List bytes = await file.readAsBytes();
              // Parse header '!4sI' (8 bytes) -> Magic bytes 'MOVI' + length
              Uint8List payload = bytes.sublist(8);
              String jsonStr = utf8.decode(payload);
              final catalog = jsonDecode(jsonStr);

              setState(() {
                moviesList = List<Map<String, dynamic>>.from(catalog['movies']);
                binariesInstalled = true;
                isLoading = false;
              });
            }

            void playMovie(Map<String, dynamic> movie) {
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF141724),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (ctx) => Padding(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Container(width: 40, height: 4, decoration: BoxDecoration(color: Colors.white24, borderRadius: BorderRadius.circular(2))),
                      const SizedBox(height: 16),
                      Text("Now Streaming: ${movie['title']}", style: const TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 8),
                      Text("Connecting to Supabase Bucket 'Raaz'...", style: TextStyle(color: Colors.tealAccent.shade400, fontSize: 13)),
                      const SizedBox(height: 20),
                      LinearProgressIndicator(color: Colors.redAccent, backgroundColor: Colors.white10),
                      const SizedBox(height: 20),
                      Text("Stream Source: ${movie['stream_url']}", textAlign: TextAlign.center, style: const TextStyle(color: Colors.white54, fontSize: 11)),
                      const SizedBox(height: 20),
                      ElevatedButton.icon(
                        onPressed: () => Navigator.pop(ctx),
                        icon: const Icon(Icons.close),
                        label: const Text("Close Player"),
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.redAccent),
                      )
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF090A10),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF111422),
                  elevation: 0,
                  title: Row(
                    children: [
                      const Icon(Icons.play_circle_fill, color: Colors.redAccent, size: 28),
                      const SizedBox(width: 8),
                      Text(metadata?['app_info']['app_name'] ?? "StreamRaaz OTT", style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 18, color: Colors.white)),
                    ],
                  ),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.settings_suggest, color: Colors.tealAccent),
                      onPressed: () => _showBinaryInfoDialog(),
                    )
                  ],
                ),
                body: isLoading
                    ? _buildLoader()
                    : !binariesInstalled
                        ? _buildDownloadPrompt()
                        : _buildMovieDashboard(),
              );
            }

            Widget _buildLoader() {
              return Center(
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 40),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const CircularProgressIndicator(color: Colors.redAccent),
                      const SizedBox(height: 20),
                      Text(statusText, style: const TextStyle(color: Colors.white70, fontSize: 14)),
                      if (downloadProgress > 0) ...[
                        const SizedBox(height: 12),
                        LinearProgressIndicator(value: downloadProgress, color: Colors.redAccent, backgroundColor: Colors.white12),
                      ]
                    ],
                  ),
                ),
              );
            }

            Widget _buildDownloadPrompt() {
              return Center(
                child: Container(
                  margin: const EdgeInsets.all(24),
                  padding: const EdgeInsets.all(20),
                  decoration: BoxDecoration(
                    color: const Color(0xFF131726),
                    borderRadius: BorderRadius.circular(16),
                    border: Border.all(color: Colors.white10),
                  ),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Icon(Icons.cloud_download_rounded, size: 64, color: Colors.redAccent),
                      const SizedBox(height: 16),
                      const Text("Download Binary Assets", style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 8),
                      const Text(
                        "App ko run karne ke liye metadata dwara required .dat binary files (catalog, Supabase module & graphics cache) download karna zaroori hai.",
                        textAlign: TextAlign.center,
                        style: TextStyle(color: Colors.white60, fontSize: 13),
                      ),
                      const SizedBox(height: 20),
                      ElevatedButton.icon(
                        onPressed: downloadAndInstallBinaries,
                        icon: const Icon(Icons.download),
                        label: const Text("Download & Mount .DAT Files"),
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.redAccent, padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 12)),
                      )
                    ],
                  ),
                ),
              );
            }

            Widget _buildMovieDashboard() {
              return ListView(
                padding: const EdgeInsets.symmetric(vertical: 16),
                children: [
                  // Featured Banner
                  Container(
                    height: 200,
                    margin: const EdgeInsets.symmetric(horizontal: 16),
                    decoration: BoxDecoration(
                      borderRadius: BorderRadius.circular(16),
                      image: const DecorationImage(
                        image: NetworkImage("https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800"),
                        fit: BoxFit.cover,
                      ),
                    ),
                    child: Container(
                      decoration: BoxDecoration(
                        borderRadius: BorderRadius.circular(16),
                        gradient: LinearGradient(begin: Alignment.bottomCenter, end: Alignment.topCenter, colors: [Colors.black.withOpacity(0.9), Colors.transparent]),
                      ),
                      padding: const EdgeInsets.all(16),
                      alignment: Alignment.bottomLeft,
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text("TRENDING NOW", style: TextStyle(color: Colors.redAccent, fontWeight: FontWeight.bold, fontSize: 11)),
                          const Text("Cyber City 2077: Raaz Protocol", style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
                          const SizedBox(height: 8),
                          ElevatedButton.icon(
                            onPressed: () => playMovie(moviesList.first),
                            icon: const Icon(Icons.play_arrow),
                            label: const Text("Watch Now"),
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.redAccent),
                          )
                        ],
                      ),
                    ),
                  ),
                  const SizedBox(height: 24),
                  const Padding(
                    padding: EdgeInsets.symmetric(horizontal: 16),
                    child: Text("Movies From .DAT Engine Catalog", style: TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold)),
                  ),
                  const SizedBox(height: 12),
                  // Movie Grid/List
                  ...moviesList.map((movie) => Container(
                        margin: const EdgeInsets.symmetric(horizontal: 16, vertical: 6),
                        decoration: BoxDecoration(color: const Color(0xFF131726), borderRadius: BorderRadius.circular(12)),
                        child: ListTile(
                          leading: ClipRRect(
                            borderRadius: BorderRadius.circular(8),
                            child: Image.network(movie['thumb'], width: 55, height: 75, fit: BoxFit.cover),
                          ),
                          title: Text(movie['title'], style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                          subtitle: Text("${movie['genre']} • Rating: ${movie['rating']}", style: const TextStyle(color: Colors.white54, fontSize: 12)),
                          trailing: ElevatedButton(
                            onPressed: () => playMovie(movie),
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.redAccent.shade700, shape: const CircleBorder(), padding: const EdgeInsets.all(10)),
                            child: const Icon(Icons.play_arrow, color: Colors.white),
                          ),
                        ),
                      ))
                ],
              );
            }

            void _showBinaryInfoDialog() {
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF151928),
                  title: const Text("Mounted Metadata Modules", style: TextStyle(color: Colors.tealAccent, fontSize: 16)),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text("Storage Bucket: ${metadata?['supabase_module']['bucket_name']}", style: const TextStyle(color: Colors.white70)),
                      Text("Lua Driver: ${metadata?['supabase_module']['lua_driver']}", style: const TextStyle(color: Colors.white70)),
                      const Divider(color: Colors.white24),
                      const Text("Loaded .DAT Binaries:", style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 4),
                      ...?metadata?['binary_packages']?.map((pkg) => Text("• ${pkg['file_name']} (${pkg['size_kb']} KB)", style: const TextStyle(color: Colors.white54, fontSize: 12))),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text("OK", style: TextStyle(color: Colors.redAccent)))
                  ],
                ),
              );
            }
          }
          EOF

      - name: Commit and Push Source Code Back to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No file changes to push."
          else
            git commit -m "Scaffold Movie App, Lua Supabase & DAT binaries [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Create Unique Release Tag & Upload Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Movie OTT Engine Release v1.0.${{ github.run_number }}"
          body: |
            ### Automated Binary Release
            - **Release APK**: Production-ready Android App with Movie Player UI.
            - **Binary Assets Pack**:
              - `catalog.dat` (Encrypted Movie Stream Registry)
              - `supabase_engine.dat` (Lua Supabase Bucket 'Raaz' Connector)
              - `graphics_cache.dat` (Hardware GFX Buffer)
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            assets/binaries/catalog.dat
            assets/binaries/supabase_engine.dat
            assets/binaries/graphics_cache.dat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
