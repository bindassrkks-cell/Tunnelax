name: Generate Project, Commit Code & Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Complete Project & Assets
        run: |
          echo ">>> 1. Creating Flutter Scaffold if missing..."
          if [ ! -f "pubspec.yaml" ]; then
            flutter create --org com.engine.app --project-name engine_app .
          fi

          echo ">>> 2. Creating Modular Asset Directories..."
          mkdir -p assets/splash assets/scripts assets/database assets/textures assets/audio assets/video assets/fonts

          echo ">>> 3. Generating Master metadata.json..."
          cat << 'EOF' > assets/metadata.json
          {
            "app_metadata": {
              "app_name": "CoreEngine App",
              "package_id": "com.engine.app",
              "version_name": "1.0.0",
              "version_code": 1,
              "build_type": "Release",
              "target_api": "Vulkan_1.3"
            },
            "splash_screen": {
              "enabled": true,
              "asset_path": "assets/splash/splash_logo.png",
              "duration_ms": 2000,
              "background_color": "#0B0E14"
            },
            "graphics_module": {
              "renderer": "Vulkan",
              "profile": "Ultra_Performance",
              "target_fps": 90,
              "resolution_scale": 0.85,
              "texture_compression": "ASTC_8x8",
              "anti_aliasing": "MSAA_4X",
              "shadow_enabled": true
            },
            "database_module": {
              "enabled": true,
              "db_name": "app_storage.db",
              "asset_path": "assets/database/app_storage.db"
            },
            "scripting_module": {
              "engine": "LuaCore",
              "entry_point": "assets/scripts/bootstrap.lua",
              "execution_order": [
                "assets/scripts/bootstrap.lua",
                "assets/scripts/patcher.lua"
              ]
            },
            "assets_registry": {
              "textures": ["assets/textures/character_diffuse.astc"],
              "audio": ["assets/audio/bgm_theme.ogg"],
              "video": ["assets/video/intro_cinematic.mp4"],
              "fonts": ["assets/fonts/engine_font.ttf"]
            }
          }
          EOF

          echo ">>> 4. Creating Valid Splash PNG Image..."
          python3 -c "import base64; open('assets/splash/splash_logo.png', 'wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='))"

          echo ">>> 5. Creating Real SQLite Database (.db)..."
          sqlite3 assets/database/app_storage.db "CREATE TABLE IF NOT EXISTS system_config (key TEXT PRIMARY KEY, val TEXT); INSERT OR REPLACE INTO system_config VALUES ('status', 'SQLite Database Connected & Active');"

          echo ">>> 6. Creating Lua Scripts..."
          cat << 'EOF' > assets/scripts/bootstrap.lua
          -- Bootstrap Lua Script
          function OnInit()
              print("[Lua Engine] Initializing graphic pipelines...")
              return "Engine Initialized successfully at 90 FPS target"
          end
          OnInit()
          EOF

          cat << 'EOF' > assets/scripts/patcher.lua
          -- Patcher Lua Script
          function ApplyTexturePatch()
              print("[Lua Patcher] Overriding texture LOD bias to -0.5")
              return "ASTC Texture Patch Applied"
          end
          ApplyTexturePatch()
          EOF

          echo ">>> 7. Creating Dummy Texture, Audio, Video & Font..."
          echo "ASTC_COMPRESSED_TEXTURE_DUMMY_HEADER" > assets/textures/character_diffuse.astc
          echo "OGG_AUDIO_HEADER_DUMMY" > assets/audio/bgm_theme.ogg
          echo "MP4_VIDEO_HEADER_DUMMY" > assets/video/intro_cinematic.mp4
          curl -sLo assets/fonts/engine_font.ttf https://github.com/google/fonts/raw/main/ofl/roboto/Roboto%5Bwdth%2Cwght%5D.ttf

          echo ">>> 8. Overwriting pubspec.yaml..."
          cat << 'EOF' > pubspec.yaml
          name: engine_app
          description: "Engine App with Assets & Metadata Module"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.3.0
            path_provider: ^2.1.2
            path: ^1.9.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/metadata.json
              - assets/splash/splash_logo.png
              - assets/scripts/bootstrap.lua
              - assets/scripts/patcher.lua
              - assets/database/app_storage.db
              - assets/textures/character_diffuse.astc
              - assets/audio/bgm_theme.ogg
              - assets/video/intro_cinematic.mp4

            fonts:
              - family: EngineFont
                fonts:
                  - asset: assets/fonts/engine_font.ttf
          EOF

          echo ">>> 9. Overwriting lib/main.dart with Complete Code..."
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:path/path.dart' as p;
          import 'package:path_provider/path_provider.dart';
          import 'package:sqflite/sqflite.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: EngineDashboard(),
            ));
          }

          class EngineDashboard extends StatefulWidget {
            const EngineDashboard({super.key});

            @override
            State<EngineDashboard> createState() => _EngineDashboardState();
          }

          class _EngineDashboardState extends State<EngineDashboard> {
            Map<String, dynamic>? metadata;
            String dbStatus = "Connecting...";
            List<String> luaLogs = [];
            bool isLoading = true;

            @override
            void initState() {
              super.initState();
              initializeSystem();
            }

            Future<void> initializeSystem() async {
              try {
                // 1. Read metadata.json
                final metaStr = await rootBundle.loadString('assets/metadata.json');
                final parsedMeta = jsonDecode(metaStr);

                // 2. Setup SQLite Database from Assets
                final docDir = await getApplicationDocumentsDirectory();
                final dbFile = File(p.join(docDir.path, 'app_storage.db'));
                if (!await dbFile.exists()) {
                  final byteData = await rootBundle.load('assets/database/app_storage.db');
                  await dbFile.writeAsBytes(byteData.buffer.asUint8List());
                }
                final database = await openDatabase(dbFile.path);
                final List<Map<String, dynamic>> records = await database.query('system_config');
                final status = records.isNotEmpty ? records.first['val'].toString() : 'Empty DB';

                // 3. Read Lua Scripts
                final bootLua = await rootBundle.loadString('assets/scripts/bootstrap.lua');
                final patchLua = await rootBundle.loadString('assets/scripts/patcher.lua');

                setState(() {
                  metadata = parsedMeta;
                  dbStatus = status;
                  luaLogs = [
                    bootLua.split('\n').firstWhere((l) => l.contains("Engine Initialized"), orElse: () => "Bootstrapped"),
                    patchLua.split('\n').firstWhere((l) => l.contains("Patch Applied"), orElse: () => "Patched"),
                  ];
                  isLoading = false;
                });
              } catch (e) {
                setState(() {
                  dbStatus = "Init Error: $e";
                  isLoading = false;
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0F111A),
                appBar: AppBar(
                  title: const Text("App Engine Core", style: TextStyle(fontFamily: 'EngineFont')),
                  backgroundColor: const Color(0xFF1A1D2B),
                  elevation: 0,
                ),
                body: isLoading
                    ? const Center(child: CircularProgressIndicator())
                    : SingleChildScrollView(
                        padding: const EdgeInsets.all(16),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            _buildInfoCard("App Metadata", [
                              "Name: ${metadata?['app_metadata']['app_name']}",
                              "Package: ${metadata?['app_metadata']['package_id']}",
                              "Target API: ${metadata?['app_metadata']['target_api']}",
                            ]),
                            const SizedBox(height: 12),
                            _buildInfoCard("Graphics Module", [
                              "Renderer: ${metadata?['graphics_module']['renderer']}",
                              "Target FPS: ${metadata?['graphics_module']['target_fps']}",
                              "Compression: ${metadata?['graphics_module']['texture_compression']}",
                              "Resolution Scale: ${metadata?['graphics_module']['resolution_scale']}",
                            ]),
                            const SizedBox(height: 12),
                            _buildInfoCard("Database Status", [
                              "Path: assets/database/app_storage.db",
                              "Live Read: $dbStatus",
                            ]),
                            const SizedBox(height: 12),
                            _buildInfoCard("Scripting Engine", [
                              "Engine: ${metadata?['scripting_module']['engine']}",
                              "Log 1: ${luaLogs.isNotEmpty ? luaLogs[0] : 'None'}",
                              "Log 2: ${luaLogs.length > 1 ? luaLogs[1] : 'None'}",
                            ]),
                          ],
                        ),
                      ),
              );
            }

            Widget _buildInfoCard(String title, List<String> lines) {
              return Card(
                color: const Color(0xFF1E2235),
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(title, style: const TextStyle(color: Colors.cyanAccent, fontSize: 16, fontWeight: FontWeight.bold)),
                      const Divider(color: Colors.white24),
                      ...lines.map((l) => Padding(
                            padding: const EdgeInsets.symmetric(vertical: 2),
                            child: Text(l, style: const TextStyle(color: Colors.white, fontSize: 13)),
                          )),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Commit and Push Source Code Back to Repository
        run: |
          echo ">>> Checking for changes to commit and push..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generate full project source code, assets & metadata [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
