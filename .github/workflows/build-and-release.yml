name: Build and Sign Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      # 1. Compile Sing-box Libbox with SagerNet Gomobile
      - name: Compile Sing-box (libbox.aar)
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}

          # SagerNet custom gomobile install karein (Required for -libname)
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          
          # Initialize gomobile with NDK path
          gomobile init

          # Clone and build sing-box libbox
          git clone --depth=1 https://github.com/SagerNet/sing-box.git sing-box-src
          cd sing-box-src
          go run ./cmd/internal/build_libbox android

          # Copy generated AAR to app/libs
          mkdir -p ../app/libs
          cp experimental/libbox/*.aar ../app/libs/libbox.aar
          cd ..
          ls -lh app/libs/

      # 2. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # 3. Assemble Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 4. Sign APK
      - name: Sign Android Release
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      # 5. Upload APK Artifact
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 14
