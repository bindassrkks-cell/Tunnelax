name: Build, Sign, and Publish APK

on:
  push:
    tags:
      - 'v*' # Trigger jab bhi tag push ho (e.g., v1.0.0, v1.0.1)
  workflow_dispatch: # Manual trigger support

permissions:
  contents: write # Release create karne aur asset upload karne ke liye mandatory hai

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      # 1. Compile Sing-box Go Core into libbox.aar
      - name: Compile Sing-box (libbox.aar)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          
          git clone --depth=1 https://github.com/SagerNet/sing-box.git sing-box-src
          cd sing-box-src
          go run ./cmd/internal/build_libbox android
          
          mkdir -p ../app/libs
          cp experimental/libbox/*.aar ../app/libs/libbox.aar
          cd ..

      # 2. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # 3. Assemble Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 4. Sign APK using Secrets
      - name: Sign Android Release
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      # 5. Rename APK (Optional: Clear filename ke liye)
      - name: Rename Signed APK
        run: |
          SIGNED_PATH="${{ steps.sign_app.outputs.signedReleaseFile }}"
          NEW_NAME="TunnelApp-${{ github.ref_name }}.apk"
          mv "$SIGNED_PATH" "$NEW_NAME"
          echo "RELEASE_APK=$NEW_NAME" >> $GITHUB_ENV

      # 6. Publish to GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ github.ref_name }}"
          files: ${{ env.RELEASE_APK }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
