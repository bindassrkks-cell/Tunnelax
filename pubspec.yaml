name: movie_stream_app
description: "Movie Streaming OTT App with Binary Package Loader"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.2
  path: ^1.9.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/metadata/metadata.json
    - assets/scripts/supabase_connect.lua
    - assets/binaries/catalog.dat
    - assets/binaries/supabase_engine.dat
    - assets/binaries/graphics_cache.dat
